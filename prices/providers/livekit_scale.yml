    prices_checked: 2026-08-20
    pricing_source_url: https://livekit.io/pricing
    price_comments: >-
      Source rate $0.003/minute on Scale, from the Telephony table: "Third-party SIP minutes ...
      50,000 minutes included (then $0.003 per min)". Converted to $/k minutes:
      0.003 * 1000 = 3 exactly.
      The only telephony meter that differs by tier: US local and toll-free inbound are the same
      $0.01 and $0.02 on Ship and Scale, so they are not repeated here and fall back to livekit.
    prices:
      telephony_kminutes: 3
