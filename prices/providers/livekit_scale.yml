# yaml-language-server: $schema=.schema.json
name: LiveKit Inference (Scale)
id: livekit-scale
pricing_tier: Scale
pricing_urls:
  - https://livekit.io/pricing
  - https://livekit.com/pricing/inference
api_pattern: 'https://[^/]*\.livekit\.cloud'
fallback_model_providers:
  - livekit
price_comments: >-
  Scale-tier prices for LiveKit Inference. Only models whose Scale rate differs from Build/Ship
  are listed here; LLM models (identical across all tiers) and flat-priced voice models fall back
  to the livekit provider via fallback_model_providers. Same conversions and source as the
  livekit provider.
models:
  - id: cartesia/ink-2
    name: Ink 2
    match:
      equals: cartesia/ink-2
    collapse: false
    prices_checked: 2026-09-23
    pricing_source_url: https://livekit.com/pricing/inference
    provenance:
      api_backed: true
    price_comments: >-
      Published Build/Ship $0.009/minute and Scale $0.0068/minute. Multiply by 1000/60 and round to
      six decimals for USD/1000 seconds.
    prices:
      input_audio_kseconds: 0.113333
