# yaml-language-server: $schema=.schema.json
name: Soniox
id: soniox
pricing_urls:
  - https://soniox.com/pricing

api_pattern: 'https://api\.soniox\.com'

provider_match:
  contains: soniox

# No model_match. `tts-` is already claimed by OpenAI's provider matcher, so a bare `tts-rt-v1`
# would be ambiguous between two vendors. Resolve with provider_id='soniox'.

price_comments: >-
  Soniox bills speech by TOKEN, not by second or character, so these rows carry `*_mtok`
  fields and no per-second or per-character rate.
  The page also quotes "equivalent to about $0.10/hour" figures. They are derived and they
  reconcile exactly (30k audio-in + 15k text-out tokens per hour gives $0.0975 async and
  $0.1200 real-time), but they are deliberately NOT stored as input_audio_kseconds: each is
  the sum of TWO meters, so a per-second input field would attribute output cost to input and
  double-count for a caller who also supplies output tokens. A runtime measuring seconds gets
  unpriced_usage instead; Soniox returns token counts and pricing from those is exact.
  Priced per mode rather than per version, so every stt-rt-* and stt-async-* resolves to its
  mode. `stt-translation` is unpriced: its mode is not stated.

pricing_tier: Pay-as-you-go

models:
  - id: stt-async
    name: Speech-to-Text (async)
    description: >-
      Soniox transcription for pre-recorded files. Covers every stt-async-* version.
      Billed by token; see the provider price_comments for why there is no per-second rate.
    match:
      or:
        - equals: stt-async
        - starts_with: stt-async-
    prices_checked: 2026-08-21
    pricing_source_url: https://soniox.com/pricing
    price_comments: >-
      Source rates from the Speech-to-Text API pricing table, "Async (file)" column: input
      audio tokens $1.50/1M, input text tokens $3.50/1M, output text tokens $3.50/1M. Stored
      1:1, which is the unit Soniox already quotes.
      Input audio tokens meter the duration of audio; input text tokens are custom
      instructions or context you supply; output text tokens are the transcript.
      Soniox's own usage reference: 1 hour of audio is about 30,000 input audio tokens, and 1
      hour of speech about 15,000 output text tokens.
    prices:
      input_audio_mtok: 1.50
      input_mtok: 3.50
      output_mtok: 3.50

  - id: stt-rt
    name: Speech-to-Text (real-time)
    description: >-
      Soniox streaming transcription, the variant a realtime voice agent runs. Covers every
      stt-rt-* version; the LiveKit plugin defaults to stt-rt-v5.
    match:
      or:
        - equals: stt-rt
        - starts_with: stt-rt-
    prices_checked: 2026-08-21
    pricing_source_url: https://soniox.com/pricing
    price_comments: >-
      Source rates from the Speech-to-Text API pricing table, "Real-time (streaming)" column:
      input audio tokens $2.00/1M, input text tokens $4.00/1M, output text tokens $4.00/1M.
      Stored 1:1.
      About 23% above async on every meter, which is the usual streaming premium.
    prices:
      input_audio_mtok: 2.00
      input_mtok: 4.00
      output_mtok: 4.00

  - id: tts-rt
    name: Text-to-Speech (real-time)
    description: >-
      Soniox streaming speech synthesis. Covers every tts-rt-* version. Billed by token in
      both directions, so it carries no per-character rate.
    match:
      or:
        - equals: tts-rt
        - starts_with: tts-rt-
    prices_checked: 2026-08-21
    pricing_source_url: https://soniox.com/pricing
    price_comments: >-
      Source rates from the Text-to-Speech API pricing table: input text tokens $4.00/1M,
      output audio tokens $21.50/1M. Stored 1:1.
      Soniox's usage reference: 1 character is about 0.3 input text tokens, and 1 hour of
      generated speech about 30,000 output audio tokens. Those give
      30000/1e6*21.50 + 15000/1e6*4.00 = $0.705 per hour, against the published "about
      $0.70/hour of generated speech", so the derived figure checks out.
      No input_kchars for the same reason the STT rows carry no per-second rate: the hourly
      figure blends two meters, and Soniox bills the tokens.
    prices:
      input_mtok: 4.00
      output_audio_mtok: 21.50
