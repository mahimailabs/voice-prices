# yaml-language-server: $schema=../../prices/providers/.schema.json
name: MiniMax
id: minimax
pricing_urls:
  - https://platform.minimax.io/docs/guides/pricing-paygo   # global / USD pay-as-you-go pricing
  - https://platform.minimaxi.com/docs/guides/pricing-paygo  # mainland China / CNY pay-as-you-go pricing

api_pattern: 'https://api\.minimax(i)?\.(io|com|chat)'

model_match:
  starts_with: minimax-

provider_match:
  contains: minimax

price_comments: >-
  MiniMax bills TTS (Text-to-Audio / T2A) per character of input text. The global
  USD pay-as-you-go pricing page (platform.minimax.io/docs/guides/pricing-paygo)
  lists speech-2.8-turbo at $60 per 1,000,000 characters and speech-2.8-hd at
  $100 per 1,000,000 characters; it also notes the older speech-2.6-turbo /
  speech-02-turbo remain listed at $60/1M and their HD variants at $100/1M.
  Converted to input_kchars (USD per 1,000 chars): rate / 1000 -> 0.06 (turbo)
  and 0.10 (hd). The mainland China page (platform.minimaxi.com) lists the same
  tiers in CNY (speech-2.8-hd ¥3.5 / 10k chars, speech-2.8-turbo ¥2 / 10k chars);
  the USD figures above are used as the canonical rate.

models:
  - id: minimax-speech-02-hd
    name: MiniMax Speech-02 HD
    description: >-
      High-fidelity Speech-02 TTS model (HD tier) from MiniMax. Generates natural,
      expressive speech with fine-grained emotion and style control. Legacy tier;
      billed per character of input text.
    match:
      equals: minimax-speech-02-hd
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      Legacy HD tier; official USD pay-as-you-go lists speech-02-hd HD at $100 / 1M
      characters => 0.10 / 1k chars. Same rate published on the CNY page (¥3.5 / 10k chars).
    prices:
      input_kchars: 0.1

  - id: minimax-speech-02-turbo
    name: MiniMax Speech-02 Turbo
    description: >-
      Low-latency Speech-02 TTS model (Turbo tier) from MiniMax. Optimized for fast,
      high-volume, conversational workloads. Legacy tier; billed per character of input text.
    match:
      equals: minimax-speech-02-turbo
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      Legacy Turbo tier; official USD pay-as-you-go lists speech-02-turbo at $60 / 1M
      characters => 0.06 / 1k chars. Same rate published on the CNY page (¥2 / 10k chars).
    prices:
      input_kchars: 0.06

  - id: minimax-speech-2.6-hd
    name: MiniMax Speech-2.6 HD
    description: >-
      High-fidelity Speech-2.6 TTS model (HD tier) from MiniMax. Strong prosody and
      natural rhythm across 40+ languages. Billed per character of input text.
    match:
      equals: minimax-speech-2.6-hd
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      HD tier; official USD pay-as-you-go lists speech-2.6-hd HD at $100 / 1M
      characters => 0.10 / 1k chars. Same rate published on the CNY page (¥3.5 / 10k chars).
    prices:
      input_kchars: 0.1

  - id: minimax-speech-2.6-turbo
    name: MiniMax Speech-2.6 Turbo
    description: >-
      Low-latency Speech-2.6 TTS model (Turbo tier) from MiniMax. Fast,
      conversational-grade synthesis for voice-agent and chat use cases. Billed per
      character of input text.
    match:
      equals: minimax-speech-2.6-turbo
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      Turbo tier; official USD pay-as-you-go lists speech-2.6-turbo at $60 / 1M
      characters => 0.06 / 1k chars. Same rate published on the CNY page (¥2 / 10k chars).
    prices:
      input_kchars: 0.06

  - id: minimax-speech-2.8-hd
    name: MiniMax Speech-2.8 HD
    description: >-
      Current flagship high-fidelity TTS model (HD tier) from MiniMax. Studio-grade
      32kHz audio with fine-grained emotion and style control across 40+ languages.
      Billed per character of input text.
    match:
      equals: minimax-speech-2.8-hd
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      Current HD flagship; official USD pay-as-you-go lists speech-2.8-hd at $100 / 1M
      characters => 0.10 / 1k chars. Same rate published on the CNY page (¥3.5 / 10k chars).
    prices:
      input_kchars: 0.1

  - id: minimax-speech-2.8-turbo
    name: MiniMax Speech-2.8 Turbo
    description: >-
      Current flagship low-latency TTS model (Turbo tier) from MiniMax. Sub-200ms
      time-to-first-byte streaming for high-volume, latency-sensitive voice-agent
      workloads. Billed per character of input text.
    match:
      equals: minimax-speech-2.8-turbo
    prices_checked: 2026-08-16
    pricing_source_url: https://platform.minimax.io/docs/guides/pricing-paygo
    price_comments: >-
      Current Turbo flagship; official USD pay-as-you-go lists speech-2.8-turbo at
      $60 / 1M characters => 0.06 / 1k chars. Same rate published on the CNY page
      (¥2 / 10k chars).
    prices:
      input_kchars: 0.06
