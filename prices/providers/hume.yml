# yaml-language-server: $schema=.schema.json
name: Hume
id: hume
pricing_urls:
  - https://www.hume.ai/pricing

api_pattern: 'https://api\.hume\.ai'

provider_match:
  contains: hume

# No model_match: `octave` is an ordinary word. Resolve with provider_id='hume'.

price_comments: >-
  Text-to-speech billed per character, as overage on a monthly plan; Hume sells no
  pay-as-you-go tier. Rate is per plan, not per model, so OCTAVE 1 and 2 share one row.
  DELIBERATELY NOT PRICED: EVI, Hume's speech-to-speech voice interface. Its per-minute
  figures are printed in parentheses on the "Monthly EVI usage included" row ($0.07/min at
  Starter and Creator, $0.06 Pro, $0.05 Scale, $0.04 Business), while the row actually labelled
  "Additional EVI 3 cost (Usage-based)" is blank below Pro. Those parenthesised numbers match
  the usage-based row where both exist, which suggests they are the per-minute rate, but they
  sit on an inclusion row and Hume does not say so. That is an inference, not a published
  rate, so EVI stays unpriced until someone can confirm it against an invoice or a support
  answer. EVI 4 MINI has no separate figure at all.

pricing_tier: Creator

models:
  - id: octave
    name: Octave
    description: >-
      Hume's text-to-speech model, exposed by the LiveKit plugin as Octave with
      `model_version` "1" or "2". Both versions bill at the same rate, so one row covers them.
    match:
      or:
        - equals: octave
        - equals: octave-1
        - equals: octave-2
    prices_checked: 2026-08-21
    pricing_source_url: https://www.hume.ai/pricing
    price_comments: >-
      Source rate $0.15 per 1,000 characters, the "Additional characters cost (Usage-based)"
      row at the Creator plan ($7/month). Stored directly: input_kchars is already per 1,000
      characters, so no conversion.
      Creator is the cheapest plan quoting a per-character rate. Free and Starter bundle
      characters (10,000 and 30,000) and leave that row blank, so neither can be the priced
      tier. Cheaper overage exists further up: Pro $0.12, Scale $0.10, Business $0.05, all
      larger commitments.
      At $0.15/1k this is the most expensive text-to-speech rate in the catalog, half again
      above Eleven v3 and Deepgram Aura-2 at $0.10 and $0.03.
    prices:
      input_kchars: 0.15
