# yaml-language-server: $schema=.schema.json
name: Cartesia
id: cartesia
pricing_urls:
  - https://cartesia.ai/pricing

api_pattern: 'https://api\.cartesia\.ai'

model_match:
  or:
    - starts_with: sonic
    - starts_with: ink

provider_match:
  contains: cartesia

price_comments: >-
  Cartesia bills in credits, not directly in dollars per character or per second. The rates in
  this catalog convert credits to dollars using Cartesia's Pro tier ($5/month for 100,000
  credits = $0.00005 per credit), which is the cheapest paid tier and the closest approximation
  to pay-as-you-go for API users. Consumers on Startup ($49/month for 1.25M credits,
  $0.0000392/credit), Scale ($299/month for 8M credits, ~$0.00003738/credit), or Enterprise
  tiers should derive their own effective rate by adjusting the credit cost accordingly.
  Cartesia raised every plan price between 2026-05-27 and 2026-08-21 while leaving the included
  credit counts unchanged (Pro $4 -> $5, Startup $39 -> $49, Scale $239 -> $299), so the dollar
  rates below rose ~25% with no change to the underlying credit cost of a character or a second.

pricing_tier: Pro

models:
  - id: ink-2
    name: Ink-2
    description: >-
      Cartesia's speech-to-text model. Billed in credits by duration of audio, on the same
      credit pool as Sonic TTS.
    match:
      starts_with: ink
    prices_checked: 2026-08-21
    pricing_source_url: https://cartesia.ai/pricing
    price_comments: >-
      Cartesia publishes no per-second rate for STT, only hours included per plan. The credit
      cost is derived from those and is consistent across all four: 20K credits / 1h51m,
      100K / 9h16m, 1.25M / 115h44m, 8M / 740h44m all give 3.00 credits per second of audio.
      Converted to $/k seconds at the Pro credit price: 3 * 0.00005 * 1000 = 0.15
      (equivalently $0.009 per minute).
    prices:
      input_audio_kseconds: 0.15

  - id: sonic-3
    name: Sonic-3.6
    description: >-
      Cartesia's current production TTS model, which the pricing page now labels Sonic-3.6.
      Pricing is per character, with a higher rate for Pro Voice Cloning (PVC) voices compared
      to standard Instant Voice Cloning (IVC) voices.
    match:
      starts_with: sonic
    prices_checked: 2026-08-21
    pricing_source_url: https://cartesia.ai/pricing#sonic
    price_comments: >-
      voice_class='pvc' applies to voices created via Cartesia's Professional Voice
      Cloning workflow; voice_class='ivc' applies to Instant Voice Cloning and the
      standard library voices. Consumers must resolve voice_id -> voice_class via
      Cartesia's voice metadata API; the voice ID list changes as Cartesia adds
      voices and is not enumerable in this YAML.
      1 credit per character at the Pro credit price: 1 * 0.00005 * 1000 = 0.05 per 1k chars.
      Was 0.04 until 2026-08-21, on the old $4 Pro price; the credit cost per character did not
      change, the plan price did.
      The id stays `sonic-3` though the vendor now says Sonic-3.6. `starts_with: sonic` matches
      either, and renaming an id over a point release would break consumers pinned to it.
      Not modelled: Cartesia Line, its voice-agent product, at $0.06/minute of call plus
      $0.014/minute of telephony on a Cartesia-provided number.
    prices:
      input_kchars: 0.05
      voice_multipliers:
        ivc: 1.0           # standard (Instant Voice Cloning): 1 credit/char
        pvc: 1.5           # Pro Voice Cloning: 1.5 credits/char (1.5x rate)
        default: 1.0       # default to IVC rate when voice_class is unspecified
