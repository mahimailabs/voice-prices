# yaml-language-server: $schema=.schema.json
name: 60db
id: 60db
pricing_urls:
  - https://60db.ai/pricing
api_pattern: 'https://api\.60db\.ai'
model_match:
  starts_with: 60db-
provider_match:
  contains: 60db
pricing_tier: Pay-as-you-go
price_comments: >-
  Published USD top-up rates, not effective subscription-credit rates. Free monthly
  credits and paid-plan allowances are excluded. Rates were checked against the
  public pricing page on 2026-10-01. API model IDs come from docs.60db.ai; Kaak, Garuda,
  Vyas and Judge are the corresponding product names on the pricing page.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: completion_tokens
        dest: output_tokens
models:
  - id: 60db-decision-model-v1
    name: 60dB Judge Decision
    match:
      equals: 60db-decision-model-v1
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Judge bills $0.010 per 1M input tokens; output tokens are free. Use the
      service-reported input token count: shared state is counted again per question.
      Model ID: https://docs.60db.ai/api-reference/judge/models
    provenance:
      evidence: 'Decisions (Judge): $0.010 per 1M input tokens; output tokens $0.'
    prices:
      input_mtok: 0.010
  - id: 60db-fast-v01
    name: 60dB Kaak Fast
    match:
      equals: 60db-fast-v01
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Published TTS rate $0.02 per 1K characters, stored directly as input_kchars.
      The pricing page publishes one TTS rate with no model-tier surcharge.
      Model ID: https://docs.60db.ai/api-reference/models/get-models
    provenance:
      evidence: 'Text to speech (Kaak): $0.02 per 1K characters.'
    prices:
      input_kchars: 0.02
  - id: 60db-judge-model-v1
    name: 60dB Judge Rubric
    match:
      equals: 60db-judge-model-v1
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Judge bills $0.010 per 1M input tokens; output tokens are free. Use the
      service-reported input token count: shared state is counted again per question.
      Model ID: https://docs.60db.ai/api-reference/judge/models
    provenance:
      evidence: 'Decisions (Judge): $0.010 per 1M input tokens; output tokens $0.'
    prices:
      input_mtok: 0.010
  - id: 60db-quality-v01
    name: 60dB Kaak Quality
    match:
      equals: 60db-quality-v01
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Published TTS rate $0.02 per 1K characters, stored directly as input_kchars.
      The pricing page publishes one TTS rate with no model-tier surcharge.
      Model ID: https://docs.60db.ai/api-reference/models/get-models
    provenance:
      evidence: 'Text to speech (Kaak): $0.02 per 1K characters.'
    prices:
      input_kchars: 0.02
  - id: 60db-stt-v01
    name: 60dB Garuda
    match:
      equals: 60db-stt-v01
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Published $0.0005 per minute. Converted to $/1K seconds:
      0.0005 * 1000 / 60 = 0.008333333333333333. The service rounds duration up
      to the nearest second; callers should pass that billed duration. No separate
      streaming/batch rate is published.
      Model ID: https://docs.60db.ai/api-reference/models/get-stt-models
    provenance:
      evidence: 'Speech to text (Garuda): $0.0005 per minute.'
    prices:
      input_audio_kseconds: 0.008333333333333333
  - id: 60db-tiny
    name: 60dB Vyas
    match:
      equals: 60db-tiny
    prices_checked: 2026-10-01
    pricing_source_url: https://60db.ai/pricing
    price_comments: >-
      Chat costs $0.02 per 1K tokens = $20 per 1M tokens, with no separate
      input/output rate published. Both token directions use that rate.
      Model ID and usage fields: https://docs.60db.ai/api-reference/llm/chat-completion
    provenance:
      evidence: 'Chat (Vyas): $0.02 per 1K tokens.'
    prices:
      input_mtok: 20
      output_mtok: 20
