# yaml-language-server: $schema=.schema.json
name: LiveKit Inference
id: livekit
pricing_tier: Build/Ship
pricing_urls:
  - https://livekit.io/pricing
  - https://livekit.com/pricing/inference
api_pattern: 'https://[^/]*\.livekit\.cloud'
provider_match:
  contains: livekit
price_comments: >-
  LiveKit Inference is a gateway that resells STT, TTS, and LLM models under a single API key, at
  its own per-model rates (distinct from buying direct from each vendor). These are the
  Build/Ship tier prices, which LiveKit publishes identically for both plans; Scale-tier
  discounts live in the livekit-scale provider. Resolution is by explicit provider_id
  (VoiceGateway passes provider_id=livekit); model_match is intentionally omitted so a bare model
  ref still resolves to the direct vendor. Conversions: STT $/min to input_audio_kseconds
  (x1000/60); TTS $/1M chars to input_kchars (/1000); LLM $/1M tokens map 1:1. Realtime bundled
  models and LiveKit Cloud platform per-minute rates are out of scope. Source: LiveKit pricing
  page structured data; regenerate with make livekit-get.
models:
  - id: assemblyai/universal-3-5-pro
    name: Universal-3.5 Pro Streaming
    match:
      or:
        - equals: assemblyai/universal-3-5-pro
        - equals: universal-3-5-pro
    collapse: false
    prices_checked: 2026-09-23
    pricing_source_url: https://livekit.com/pricing/inference
    provenance:
      api_backed: true
    price_comments: >-
      Published Build/Ship $0.0075/minute and Scale $0.0075/minute. Multiply by 1000/60 and round
      to six decimals for USD/1000 seconds.
    prices:
      input_audio_kseconds: 0.125
  - id: assemblyai/universal-3-6-pro
    name: Universal-3.6 Pro Streaming
    match:
      equals: assemblyai/universal-3-6-pro
