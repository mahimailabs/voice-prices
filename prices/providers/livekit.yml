      The cheapest way to put a LiveKit agent on the phone network.
    match:
      equals: sip-thirdparty
    prices_checked: 2026-08-20
    pricing_source_url: https://livekit.io/pricing
    price_comments: >-
      Source rate $0.004/minute on the Ship plan, from the Telephony table: "Third-party SIP
      minutes ... 5,000 minutes included (then $0.004 per min)". Converted to $/k minutes:
      0.004 * 1000 = 4 exactly.
      Scale pays $0.003/minute and is the one telephony meter that differs by tier, so it is
      listed in the livekit-scale provider. The included allowance (1,000 minutes on Build,
      5,000 on Ship) is not modelled; this is the overage rate.
    prices:
      telephony_kminutes: 4

