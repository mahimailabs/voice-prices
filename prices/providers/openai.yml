# yaml-language-server: $schema=.schema.json
name: OpenAI
id: openai
pricing_urls:
  - https://platform.openai.com/docs/pricing
  - https://openai.com/api/pricing/
  - https://platform.openai.com/docs/models
  - https://help.openai.com/en/articles/7127956-how-much-does-gpt-4-cost
api_pattern: 'https://api\.openai\.com'
model_match:
  or:
    - starts_with: "gpt-"
    - regex: "^o[134]"
    - starts_with: "tts-"
    - starts_with: "whisper-"
provider_match:
  contains: openai
extractors:
  # https://github.com/openai/openai-python/blob/v1.99.6/src/openai/types/completion_usage.py
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://github.com/openai/openai-python/blob/v1.99.6/src/openai/types/responses/response_usage.py
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
  # https://github.com/openai/openai-python/blob/v2.3.0/src/openai/types/create_embedding_response.py
  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens

pricing_tier: Standard

models:
  - id: ada
    match:
      or:
        - equals: ada
        - equals: text-ada-001
    prices:
      input_mtok: 0.4
      output_mtok: 0.4

