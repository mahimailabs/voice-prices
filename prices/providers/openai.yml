  - id: gpt-4o-mini-transcribe
    name: GPT-4o mini Transcribe
    match:
      # The dated snapshot bills at the base model's rate; OpenAI publishes no separate row.
      or:
        - equals: gpt-4o-mini-transcribe
        - equals: gpt-4o-mini-transcribe-2025-12-15
    prices_checked: 2026-08-20
    pricing_source_url: https://platform.openai.com/docs/pricing
    price_comments: >-
      Token rates are the bill: $1.25/1M text input, $3/1M audio input, $5/1M output.
      input_audio_kseconds is NOT a billing rate. OpenAI prints $0.003/minute for this model
      in a column headed "Estimated cost", derived from an assumed speech density, alongside
      the token rates that are actually charged. Converted to $/k seconds:
      0.003 * 1000 / 60 = 0.05 exactly.
      It is recorded because a voice runtime measures seconds and would otherwise get a
      silent $0 here, and flagged in provenance.estimated_fields because a caller
      reconciling against an OpenAI invoice must use the token rates instead.
      The two meters will not agree: which one is closer depends on how fast the speaker
      talks, and OpenAI does not publish the tokens-per-minute assumption behind the estimate.
    provenance:
      estimated_fields:
        - input_audio_kseconds
    prices:
      input_mtok: 1.25
      input_audio_mtok: 3
      output_mtok: 5
      input_audio_kseconds: 0.05

