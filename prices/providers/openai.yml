    price_comments: >-
      Source rate $0.0045 per minute, listed on the model page as "Transcription audio
      duration / Per minute". Converted to $/k seconds: 0.0045 * 1000 / 60 = 0.075 exactly.
      This is the billed meter. The pricing table publishes "-" in both token columns for
      this model, under a section headed "Prices per 1M tokens unless noted", so the
      per-minute figure is the noted exception rather than an estimate derived from tokens.
      Audio is input only, so the whole rate belongs to input_audio_kseconds.
      Note this is a different model from gpt-4o-transcribe ($0.006/min estimated, billed
      per token) and roughly a third cheaper.
    prices:
      input_audio_kseconds: 0.075

