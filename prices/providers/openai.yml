  - id: gpt-realtime-translate
    name: GPT-Realtime-Translate
    description: >-
      Streaming speech-to-speech translation for live multilingual audio. Takes source audio
      and returns translated audio plus transcript deltas while the source is still arriving.
      Runs on a dedicated realtime translation endpoint. Billed by audio duration, not tokens.
    match:
      equals: gpt-realtime-translate
    prices_checked: 2026-08-20
    pricing_source_url: https://platform.openai.com/docs/models/gpt-realtime-translate
    price_comments: >-
      Source rate $0.034 per minute, listed on the model page as "Realtime audio duration /
      Per minute". Converted to $/k seconds: 0.034 * 1000 / 60 = 0.5666666 recurring, stored
      as 0.566667. The page states it outright: "priced by audio duration rather than text
      tokens." No token rate is published.
      Caveat: this model outputs audio as well as taking it in, yet only one duration meter
      is published, so which direction it measures is not stated. Recorded against
      input_audio_kseconds because OpenAI uses the identical metric name on
      gpt-live-transcribe and gpt-realtime-whisper, where audio is input only and the meter
      can therefore only mean input duration. If OpenAI clarifies that it meters both
      directions, revisit this rather than silently doubling it.
    prices:
      input_audio_kseconds: 0.566667

  - id: gpt-realtime-whisper
    name: GPT-Realtime-Whisper
    description: >-
      Streaming speech-to-text for low-latency transcript deltas from live audio.
      Billed by audio duration, not tokens.
    match:
      equals: gpt-realtime-whisper
    prices_checked: 2026-08-20
    pricing_source_url: https://platform.openai.com/docs/models/gpt-realtime-whisper
    price_comments: >-
      Source rate $0.017 per minute, listed on the model page as "Realtime audio duration /
      Per minute". Converted to $/k seconds: 0.017 * 1000 / 60 = 0.2833333 recurring,
      stored rounded to six decimal places as 0.283333, as for gpt-live-transcribe.
      The model page states outright: "GPT-Realtime-Whisper is priced by audio duration
      rather than text tokens." No token rate is published, so there is no second meter and
      nothing here is an estimate. Audio is input only.
      Same rate as gpt-live-transcribe; the two are separate model ids, so both are listed.
    prices:
      input_audio_kseconds: 0.283333

  - id: gpt-transcribe
    name: GPT Transcribe
    description: >-
      High-accuracy speech-to-text for completed audio files, streamed file transcripts, and
      committed turns in Realtime sessions. Billed by audio duration, not tokens.
    match:
      equals: gpt-transcribe
    prices_checked: 2026-08-20
