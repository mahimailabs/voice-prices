  - id: gpt-live-transcribe
    name: GPT Live Transcribe
    description: >-
      Low-latency streaming speech-to-text for realtime transcript deltas from live audio.
      Billed by audio duration, not tokens.
    match:
      equals: gpt-live-transcribe
    prices_checked: 2026-08-20
    pricing_source_url: https://platform.openai.com/docs/models/gpt-live-transcribe
    price_comments: >-
      Source rate $0.017 per minute, listed on the model page as "Realtime audio duration /
      Per minute". Converted to $/k seconds: 0.017 * 1000 / 60 = 0.2833333 recurring,
      stored rounded to six decimal places as 0.283333, matching the other per-minute
      conversions in this catalog. A one-hour call prices $1.0199988 against $1.02 billed.
      This is the billed meter, not a derived estimate. The pricing table publishes "-" in
      both the input and output token columns for this model, and the section is headed
      "Prices per 1M tokens unless noted", so the per-minute figure is what is noted.
      Contrast gpt-4o-transcribe, which publishes token rates AND a per-minute figure; there
      the tokens are the bill and the minute is OpenAI's own estimate.
      Audio is input only, so the whole rate belongs to input_audio_kseconds.
    prices:
      input_audio_kseconds: 0.283333

