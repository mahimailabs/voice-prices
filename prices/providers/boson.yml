# yaml-language-server: $schema=.schema.json
name: Boson AI
id: boson
pricing_urls:
  - https://www.boson.ai/pricing
api_pattern: 'https://api\.boson\.ai'
model_match:
  starts_with: higgs-
provider_match:
  contains: boson
# Boson's API is OpenAI-chat shaped, so this mirrors openai.yml exactly: the totals go to
# input_tokens / output_tokens and the detail buckets carry the audio and cached subsets. An
# earlier revision routed prompt_tokens AND prompt_tokens_details.audio_tokens both to
# input_audio_tokens; mappings sharing a destination are summed, so a response reporting 1,000
# prompt tokens of which 900 were audio was billed as 1,900.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_audio_read_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: higgs-realtime
    name: Higgs Realtime
    description: >-
      Boson AI's realtime speech-to-speech model for conversational agents.
      Boson publishes one blended token rate per direction rather than separate
      audio and text rates, so the same figure is recorded for both.
    match:
      equals: higgs-realtime
    prices_checked: 2026-08-16
    pricing_source_url: https://www.boson.ai/pricing
    price_comments: >-
      Source page lists Input tokens $0.75 / 1M, Cached input tokens $0.25 / 1M and
      Output tokens $4.50 / 1M. Those rates are modality-blended: the page publishes
      no separate audio-token line, so the same figure is recorded for the text and
      audio fields rather than leaving either unpriced.

      The blended rates do apply to audio, which the page's own per-minute estimates
      confirm. It quotes $0.0023/min audio input and $0.014/min audio output.
      0.0023 / 0.75 * 1e6 = 3,067 tokens/min = 51.1 tokens/sec, and
      0.014 / 4.50 * 1e6 = 3,111 tokens/min = 51.9 tokens/sec. Both meters land on
      the same ~51 tokens/sec, which only holds if $0.75 and $4.50 are the rates
      applied to audio tokens.

      Transcription input at $0.0025 / minute is deliberately excluded: it is a
      separate per-minute meter, not an S2S audio-token rate.
    prices:
      input_mtok: 0.75
      output_mtok: 4.50
      input_audio_mtok: 0.75
      cache_audio_read_mtok: 0.25
      output_audio_mtok: 4.50
