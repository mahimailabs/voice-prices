# yaml-language-server: $schema=.schema.json
name: Novita
id: novita
pricing_urls:
  - https://novita.ai/pricing
api_pattern: 'https://api\.novita\.ai'
# Explicit `equals` clauses only, never a prefix: Novita's LLM ids are generic upstream names
# (google/gemma-2-9b-it, mistralai/mistral-7b-instruct) shared with several other providers in
# this catalog, so a broad clause here would silently steal their routing. Only the ids unique
# to Novita are listed, which is what lets `calc_price(model_ref=...)` work without provider_id.
model_match:
  or:
    - equals: fish-audio-text-to-speech
    - equals: minimax-speech-2.6-hd
    - equals: minimax-speech-2.6-turbo
provider_match:
  contains: novita
models:
  - id: Sao10K/L3-8B-Stheno-v3.2
    match:
      equals: Sao10K/L3-8B-Stheno-v3.2
    prices:
      input_mtok: 0.05
      output_mtok: 0.05

