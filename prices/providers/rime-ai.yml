# yaml-language-server: $schema=../../prices/providers/.schema.json
name: Rime AI
id: rime
pricing_urls:
  - https://rime.ai/pricing

api_pattern: 'https://users\.rime\.ai'

# Rime model ids (modelId in the API) do not share a single common text prefix
# (e.g. `coda`, `mistv2`, `mistv3`, `arcana`, `luna`), so a `starts_with` cannot
# cover them all. A `regex` is used to match the known documented Rime model ids.
model_match:
  regex: '^(coda|mistv2|mistv3|arcana|luna|rime-tts)$'

provider_match:
  contains: rime

price_comments: >-
  Rime bills usage-based by characters (Starter plan). Official pricing page
  (https://rime.ai/pricing, model comparison) publishes per-1,000-characters
  rates: Mist v3 = $0.03 / 1K chars and Coda = $0.05 / 1K chars. These map
  directly to input_kchars (USD per 1,000 input characters). Starter includes
  ~3,000 free minutes; Enterprise is custom volume pricing (no published rate).
  Arcana was sunset on 2026-08-15 and is kept only as a deprecated entry at its
  last published $0.04 / 1K rate.

models:
  - id: arcana
    name: Rime Arcana
    description: >-
      Expressive conversational TTS model (vibes/expressive prosody). Sunset by
      Rime on 2026-08-15; retained as a deprecated entry for historical rates.
    match:
      equals: arcana
    deprecated: true
    prices_checked: 2026-08-16
    pricing_source_url: https://rime.ai/pricing
    price_comments: >-
      Last published official rate (pre-sunset): $0.04 per 1,000 characters =>
      input_kchars = 0.04. Arcana is no longer listed on the current pricing
      page (sunset 2026-08-15).
    prices:
      input_kchars: 0.04

  - id: coda
    name: Rime Coda
    description: >-
      Flagship conversational TTS model for the most natural expression.
      Production-ready in 8 languages with 184 curated voices and sub-100ms
      cloud latency.
    match:
      equals: coda
    prices_checked: 2026-08-16
    pricing_source_url: https://rime.ai/pricing
    price_comments: >-
      Official Starter rate: $0.05 per 1,000 characters (~$0.05/minute) =>
      input_kchars = 0.05.
    prices:
      input_kchars: 0.05

  - id: mistv2
    name: Rime Mist v2
    description: >-
      Ultra-low-latency conversational TTS model (Mist family). Supports English
      and Spanish. Same per-character rate as the newer Mist v3.
    match:
      equals: mistv2
    prices_checked: 2026-08-16
    pricing_source_url: https://rime.ai/pricing
    price_comments: >-
      Official Mist rate: $0.03 per 1,000 characters (~$0.03/minute) =>
      input_kchars = 0.03. Applies to the Mist family (v2 and v3).
    prices:
      input_kchars: 0.03

  - id: mistv3
    name: Rime Mist v3
    description: >-
      Current-generation ultra-low-latency conversational TTS model (Mist
      family). English-only, ~37ms P50 time-to-first-audio in the cloud.
    match:
      equals: mistv3
    prices_checked: 2026-08-16
    pricing_source_url: https://rime.ai/pricing
    price_comments: >-
      Official Mist v3 rate: $0.03 per 1,000 characters (~$0.03/minute) =>
      input_kchars = 0.03. Applies to the Mist family (v2 and v3).
    prices:
      input_kchars: 0.03
