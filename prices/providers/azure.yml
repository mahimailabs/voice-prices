# yaml-language-server: $schema=.schema.json
name: Microsoft Azure
id: azure
pricing_urls:
  - https://azure.microsoft.com/en-us/pricing/details/cognitive-services/openai-service/#pricing
  - https://azure.microsoft.com/en-us/pricing/details/cognitive-services/speech-services/
api_pattern: (https?://)?([^.]*\.)?(?:openai\.azure\.com|azure-api\.net|cognitiveservices\.azure\.com|speech\.microsoft\.com)

# Azure OpenAI has no plan to choose between; Azure Speech does, and S0 is its pay-as-you-go
# tier. The commitment tiers (from $1,600/month for 2,000 hours) are cheaper per unit but are
# not reachable without a commitment, so they are not what this catalog prices.
pricing_tier: Standard (S0)
price_comments: >-
  These are prices for "*-Global" models, prices for "Regional" models are often slightly higher.
  Retired models are listed at https://learn.microsoft.com/th-th/azure/ai-foundry/openai/concepts/legacy-models
extractors:
  # https://github.com/openai/openai-python/blob/v1.99.6/src/openai/types/completion_usage.py
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://github.com/openai/openai-python/blob/v1.99.6/src/openai/types/responses/response_usage.py
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
  # https://github.com/openai/openai-python/blob/v2.3.0/src/openai/types/create_embedding_response.py
  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
  - root: usage
    api_flavor: anthropic
    mappings:
      - path: input_tokens
        dest: input_tokens
        # when Anthropic quotes prices for input tokens, they included all input tokens
      - path: cache_creation_input_tokens
        dest: input_tokens
        required: false
      - path: cache_read_input_tokens
        dest: input_tokens
        required: false
      - path: cache_creation_input_tokens
        dest: cache_write_tokens
        required: false
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

fallback_model_providers:
  - openai
  - anthropic

models:
  - id: ada
    match:
      or:
        - equals: ada
        - equals: text-embedding-ada
        - equals: text-embedding-ada-002
        - equals: text-embedding-ada-002-v2
    prices_checked: 2025-07-13
    prices:
      input_mtok: 0.1

  - id: babbage
    match:
      or:
        - equals: babbage
        - equals: babbage-002
    prices_checked: 2025-07-13
    prices:
      input_mtok: 0.4

  - id: curie
    match:
      or:
        - equals: curie
        - equals: text-curie
        - equals: text-curie-001
    prices_checked: 2025-07-13
    prices:
      input_mtok: 2

  - id: davinci
    match:
      or:
        - equals: davinci
        - equals: davinci-002
        - equals: text-davinci
        - equals: text-davinci-002
    prices_checked: 2025-07-13
    prices:
      input_mtok: 2

  - id: mai-ds-r1:free
    free: true
    name: MAI DS R1 (free)
    match:
      equals: mai-ds-r1:free
    prices: {}

  - id: o1
    match:
      or:
        - equals: o1
        - equals: o1-2024-12-17
        - equals: o1-preview
        - equals: o1-preview-2024-09-12
    prices_checked: 2025-07-03
    prices:
      input_mtok: 15
      cache_read_mtok: 7.5
      output_mtok: 60

  - id: o1-mini
    match:
      or:
        - equals: o1-mini
        - equals: o1-mini-2024-09-12
    prices_checked: 2025-07-03
    prices:
      input_mtok: 1.1
      cache_read_mtok: 0.55
      output_mtok: 4.4

  - id: o3-2025-04-16
    match:
      or:
        - equals: o3
        - equals: o3-2025-04-16
    prices_checked: 2025-07-05
    prices:
      input_mtok: 2
      cache_read_mtok: 0.5
      output_mtok: 8

  - id: o3-mini
    match:
      or:
        - equals: o3-mini
        - equals: o3-mini-2025-01-31
    prices_checked: 2025-07-03
    prices:
      input_mtok: 1.1
      cache_read_mtok: 0.55
      output_mtok: 4.4

  - id: o4-mini
    match:
      or:
        - contains: o4-mini
        - contains: o4-mini-2025-04-16
    prices_checked: 2025-07-05
    prices:
      input_mtok: 1.1
      cache_read_mtok: 0.28
      output_mtok: 4.4

  - id: phi-3-medium-128k-instruct
    name: Phi-3 Medium 128K Instruct
    match:
      equals: phi-3-medium-128k-instruct
    prices:
      input_mtok: 1
      output_mtok: 1

  - id: phi-3-mini-128k-instruct
    name: Phi-3 Mini 128K Instruct
    match:
      equals: phi-3-mini-128k-instruct
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: phi-3.5-mini-128k-instruct
    name: Phi-3.5 Mini 128K Instruct
    match:
      equals: phi-3.5-mini-128k-instruct
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: phi-4
    name: Phi 4
    match:
      equals: phi-4
    prices:
      input_mtok: 0.07
      output_mtok: 0.14

  - id: phi-4-multimodal-instruct
    name: Phi 4 Multimodal Instruct
    match:
      equals: phi-4-multimodal-instruct
    prices:
      input_mtok: 0.05
      output_mtok: 0.1

  - id: phi-4-reasoning-plus
    name: Phi 4 Reasoning Plus
    match:
      equals: phi-4-reasoning-plus
    prices:
      input_mtok: 0.07
      output_mtok: 0.35

  - id: phi-4-reasoning-plus:free
    free: true
    name: Phi 4 Reasoning Plus (free)
    match:
      equals: phi-4-reasoning-plus:free
    prices: {}

  - id: phi-4-reasoning:free
    free: true
    name: Phi 4 Reasoning (free)
    match:
      equals: phi-4-reasoning:free
    prices: {}

  - id: stt-standard
    name: Azure Speech to Text (real-time)
    description: >-
      Real-time transcription on the Standard model, which is what the LiveKit Azure plugin
      uses. Use `stt-standard-batch` for pre-recorded audio.
    match:
      or:
        - equals: stt-standard
        - equals: azure-stt
    prices_checked: 2026-08-21
    pricing_source_url: https://azure.microsoft.com/en-us/pricing/details/cognitive-services/speech-services/
    price_comments: >-
      Source rate $1 per hour, the "Speech to Text / Standard Transcription / Real-time
      Transcription" row of the pay-as-you-go table. Converted to $/k seconds:
      1 / 3600 * 1000 = 0.2777777 recurring, stored as 0.277778 (equivalently $0.0166667/min).
      Billed per second. Not modelled: Custom Transcription ($1.20/hour), endpoint hosting
      ($0.0538 per model per hour), Custom Speech training ($10 per compute hour), the enhanced
      add-on features (language identification, diarization, pronunciation assessment, $0.30 per
      hour per feature in real-time), the free F0 tier's 5 audio hours a month, and the
      commitment tiers.
      Also not priced here: Voice Live, which bills per token rather than per second and is a
      different product from Speech to Text.
    prices:
      input_audio_kseconds: 0.277778
  - id: stt-standard-batch
    name: Azure Speech to Text (batch)
    description: >-
      Batch transcription of pre-recorded audio on the Standard model. An 82% discount on the
      real-time rate, the steepest batch discount of any provider in this catalog.
    match:
      equals: stt-standard-batch
    prices_checked: 2026-08-21
    pricing_source_url: https://azure.microsoft.com/en-us/pricing/details/cognitive-services/speech-services/
    price_comments: >-
      Source rate $0.18 per hour, the "Batch Transcription" figure in the same Standard
      Transcription row. Converted to $/k seconds: 0.18 / 3600 * 1000 = 0.05
      (equivalently $0.003/min).
      Batch includes continuous language identification and diarization at no extra charge,
      which cost $0.30 per hour per feature in real-time.
    prices:
      input_audio_kseconds: 0.05
  - id: text-embedding-3-large
    match:
      equals: text-embedding-3-large
    prices_checked: 2025-07-13
    prices:
      input_mtok: 0.13

  - id: text-embedding-3-small
    match:
      equals: text-embedding-3-small
    prices_checked: 2025-07-13
    prices:
      input_mtok: 0.02

  - id: tts-neural
    name: Azure Text to Speech (Neural)
    description: >-
      Standard Voice, Neural and Neural HD Flash, real-time and batch. One rate covers all of
      them, and it is the only pay-as-you-go TTS rate Azure publishes.
    match:
      or:
        - equals: tts-neural
        - equals: azure-tts
    prices_checked: 2026-08-21
    pricing_source_url: https://azure.microsoft.com/en-us/pricing/details/cognitive-services/speech-services/
    price_comments: >-
      Source rate $15 per 1M characters, the "Text to Speech / Standard Voice / Neural, Neural
      HD Flash (real-time and batch)" row. Converted: 15 / 1000 = 0.015 per 1k characters.
      Azure selects a voice by name rather than by a model parameter, so these ids are catalog
      ids. Resolve with provider_id='azure'.
      Not modelled: Custom Voice Professional synthesis ($24 per 1M characters, $48 for neural
      HD), voice model training ($52 per compute hour up to $936), endpoint hosting ($4.04 per
      model per hour), the free tier's 0.5M characters a month, and the Avatar add-on
      ($0.50/minute real-time), which is video rather than speech.
      Neural HD (as distinct from Neural HD Flash) is listed as N/A on the pay-as-you-go table,
      so it has no rate to record.
    prices:
      input_kchars: 0.015
  - id: wizardlm-2-8x22b
    name: WizardLM-2 8x22B
    match:
      equals: wizardlm-2-8x22b
    prices:
      input_mtok: 0.48
      output_mtok: 0.48
