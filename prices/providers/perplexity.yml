# yaml-language-server: $schema=.schema.json
name: Perplexity
id: perplexity
pricing_urls:
  - https://docs.perplexity.ai/guides/pricing
api_pattern: 'https://api\.perplexity\.ai'
price_comments: >-
  Prices per request vary based on usage, this is not represented here,
  instead we just take the highest price shown for `requests_kcount`.
models:
  - id: llama-3.1-sonar-large-128k-online
    name: Llama 3.1 Sonar 70B Online
    match:
      equals: llama-3.1-sonar-large-128k-online
    prices:
      input_mtok: 1
      output_mtok: 1

  - id: llama-3.1-sonar-small-128k-online
    name: Llama 3.1 Sonar 8B Online
    match:
      equals: llama-3.1-sonar-small-128k-online
    prices:
      input_mtok: 0.2
      output_mtok: 0.2

  - id: r1-1776
    name: R1 1776
    match:
      equals: r1-1776
    prices_checked: 2025-07-03
    prices:
      input_mtok: 2
      output_mtok: 8

  - id: sonar
    name: Sonar
    match:
      equals: sonar
    prices_checked: 2025-07-03
    prices:
      input_mtok: 1
      output_mtok: 1
      requests_kcount: 12

  - id: sonar-deep-research
    name: Sonar Deep Research
    match:
      equals: sonar-deep-research
    prices:
      input_mtok: 2
      output_mtok: 8

  - id: sonar-pro
    name: Sonar Pro
    match:
      equals: sonar-pro
    prices_checked: 2025-07-03
    prices:
      requests_kcount: 14
      input_mtok: 3
      output_mtok: 15

  - id: sonar-reasoning
    name: Sonar Reasoning
    match:
      equals: sonar-reasoning
    prices_checked: 2025-07-03
    prices:
      requests_kcount: 12
      input_mtok: 1
      output_mtok: 5

  - id: sonar-reasoning-pro
    name: Sonar Reasoning Pro
    match:
      equals: sonar-reasoning-pro
    prices_checked: 2025-07-03
    prices:
      requests_kcount: 14
      input_mtok: 2
      output_mtok: 8
