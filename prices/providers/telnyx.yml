  - id: natural
    name: Telnyx Natural TTS
    description: >-
      Telnyx Natural TTS model (Rime Mist pre-built voices). Low latency, good
      quality, English only. Voice IDs: `Telnyx.Natural.<voice>`.
    match:
      starts_with: telnyx.natural.
    prices_checked: "2026-07-17"
    pricing_source_url: https://telnyx.com/pricing/text-to-speech
    price_comments: >-
      Source rate $0.000003 per character = $0.003 / 1k chars.
    prices:
      input_kchars: 0.003
    provenance:
      api_backed: true

  - id: natural-hd
    name: Telnyx NaturalHD TTS
    description: >-
      Telnyx NaturalHD TTS model (Rime Arcana pre-built voices). Low latency,
      better quality, 9 languages. Voice IDs: `Telnyx.NaturalHD.<voice>`.
    match:
      starts_with: telnyx.naturalhd.
    prices_checked: "2026-07-17"
    pricing_source_url: https://telnyx.com/pricing/text-to-speech
    price_comments: >-
      Source rate $0.000048 per character = $0.048 / 1k chars.
    prices:
      input_kchars: 0.048
    provenance:
      api_backed: true

  - id: openai-gpt-5.4-mini
    match:
      equals: openai-gpt-5.4-mini
    price_comments: Imported from the Telnyx public pricing API (https://api.telnyx.com/v2/pricing/products/inference),
      unit per_1k_tokens, converted x1000 to $/Mtok. Re-run `make telnyx-get` to refresh.
    pricing_source_url: https://api.telnyx.com/v2/pricing/products/inference
    prices:
      input_mtok: 0.75
      cache_read_mtok: 0.075
      output_mtok: 4.5
    provenance:
      source: imported
      api_backed: true

  - id: qwen3tts
    name: Telnyx Qwen3TTS
    description: >-
      Telnyx Qwen3TTS model. Medium latency, high quality, 11 languages.
      Requires a cloned voice from Voice Design. Voice IDs:
      `Telnyx.Qwen3TTS.<voice>`.
    match:
      starts_with: telnyx.qwen3tts.
    prices_checked: "2026-07-17"
    pricing_source_url: https://telnyx.com/pricing/text-to-speech
    price_comments: >-
      Source rate $0.000032 per character = $0.032 / 1k chars.
    prices:
      input_kchars: 0.032
    provenance:
      api_backed: true

  - id: telnyx-stt
    name: Telnyx STT
    description: >-
      Telnyx native speech-to-text (powered by Whisper), accessed via the
      Telnyx STT WebSocket streaming API. The livekit-plugins-telnyx STT
      plugin reports `model = transcription_engine` (default: "telnyx").
    match:
      equals: telnyx
    prices_checked: "2026-07-17"
    pricing_source_url: https://telnyx.com/pricing/speech-to-text
    price_comments: >-
      Source rate $0.015/minute. Converted to $/k seconds:
      0.015 * 1000 / 60 = 0.25.
    prices:
      input_audio_kseconds: 0.25
    provenance:
      api_backed: true

  - id: ultra
    name: Telnyx Ultra TTS
    description: >-
      Telnyx Ultra TTS model. Lowest latency, highest quality, 44 languages.
      Pre-built voices. REST only (no WebSocket). Voice IDs:
      `Telnyx.Ultra.<voice>`.
    match:
      starts_with: telnyx.ultra.
    prices_checked: "2026-07-17"
    pricing_source_url: https://telnyx.com/pricing/text-to-speech
    price_comments: >-
      Source rate $0.000032 per character = $0.032 / 1k chars.
    prices:
      input_kchars: 0.032
    provenance:
      api_backed: true

  - id: us-local-inbound
    name: US local (inbound)
    description: >-
      Calls received on a Telnyx US local number, over Elastic SIP Trunking.
      Telnyx publishes a floor for this, not a rate. See price_comments.
    match:
      equals: us-local-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://telnyx.com/pricing/elastic-sip
    price_comments: >-
      Published as "Starting at $0.0032 per minute", Receive inbound calls / Local calls,
      Pay as you go, United States. Converted to $/k minutes: 0.0032 * 1000 = 3.2 exactly.
      This is a FLOOR, not a rate. Telnyx prices inbound by the calling number and destination
      and publishes only the minimum, so the invoice is this or higher and by an amount they do
      not state. Flagged in provenance.estimated_fields for that reason: comparing it against a
      vendor that publishes an exact rate understates Telnyx by an unknown margin.
      The exact per-destination rates are in the global price sheet Telnyx offers as a download,
      which is not modelled here.
    provenance:
      estimated_fields:
        - telephony_kminutes
    prices:
      telephony_kminutes: 3.2

  - id: us-local-outbound
    name: US local (outbound)
    description: >-
      Calls placed to a US local number over Elastic SIP Trunking.
      Telnyx publishes a floor for this, not a rate. See price_comments.
    match:
      equals: us-local-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://telnyx.com/pricing/elastic-sip
    price_comments: >-
      Published as "Starting at $0.005 per minute", Make outbound calls / Local calls,
      Pay as you go, United States. Converted to $/k minutes: 0.005 * 1000 = 5 exactly.
      A FLOOR, not a rate: outbound cost varies by destination and Telnyx publishes only the
      minimum. Flagged in provenance.estimated_fields.
      Telnyx also lists call-per-second thresholds that change outbound pricing, which are not
      modelled.
    provenance:
      estimated_fields:
        - telephony_kminutes
    prices:
      telephony_kminutes: 5

  - id: us-tollfree-inbound
    name: US toll-free (inbound)
    description: >-
      Calls received on a Telnyx US toll-free number.
      Telnyx publishes a floor for this, not a rate. See price_comments.
    match:
      equals: us-tollfree-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://telnyx.com/pricing/elastic-sip
    price_comments: >-
      Published as "Starting at $0.015 per minute", Receive inbound calls / Toll-free calls,
      Pay as you go, United States. Converted to $/k minutes: 0.015 * 1000 = 15 exactly.
      A FLOOR, and Telnyx footnotes this row specifically: "Toll-free has different rates based
      on the calling number." So the spread here is explicitly acknowledged by the vendor and
      the published number is the best case. Flagged in provenance.estimated_fields.
      Telnyx also sells unlimited concurrent inbound via channels at $8 to $12 per month per
      channel, which is a subscription rather than a per-minute rate and is not modelled.
    provenance:
      estimated_fields:
        - telephony_kminutes
    prices:
      telephony_kminutes: 15

  - id: us-tollfree-outbound
    name: US toll-free (outbound)
    description: >-
      Calls placed to a US toll-free number. Free of charge on Telnyx, which is why this row
      carries no rate.
    match:
      equals: us-tollfree-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://telnyx.com/pricing/elastic-sip
    price_comments: >-
      Published as "Free", Make outbound calls / Toll-free calls, Pay as you go, United States.
      Stored as 0, which is a real published rate rather than an unpriced row: Telnyx does not
      charge for dialling out to a toll-free number. Twilio charges $0.0140/minute for the same
      leg, so this is the largest single gap between the two carriers in this catalog.
      Not flagged as a floor, unlike the other three Telnyx rows: "Free" carries no "starting
      at" hedge.
      Expressed as empty prices, the convention this catalog already uses for a free model
      (see openai/moderation). One consequence worth knowing: a free row and an unpriced row
      are indistinguishable in the data, so `unpriced_usage` will name telephony_minutes here
      even though the zero is real. The `description` is what separates the two today.
    prices: {}
