# yaml-language-server: $schema=.schema.json
name: Mistral
id: mistral
pricing_urls:
  - https://mistral.ai/pricing#api-pricing
api_pattern: 'https://api\.mistral\.ai'
provider_match:
  starts_with: mistral
model_match:
  regex: (?:mi|code|dev|magi|mini)stral

# https://github.com/mistralai/client-python/blob/v1.9.3/src/mistralai/models/usageinfo.py
extractors:
  - root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: completion_tokens
        dest: output_tokens

models:
  - id: codestral
    name: Codestral
    match:
      or:
        - equals: codestral-latest
        - equals: codestral-2501
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.3
      output_mtok: 0.9

  - id: devstral-small
    name: Devstral Small
    match:
      equals: devstral-small
    prices:
      input_mtok: 0.06
      output_mtok: 0.12

  - id: devstral-small:free
    free: true
    name: Devstral Small (free)
    match:
      equals: devstral-small:free
    prices: {}

  - id: magistral-medium
    name: Magistral Medium
    match:
      or:
        - starts_with: magistral-medium
    prices_checked: 2025-08-12
    prices:
      input_mtok: 2
      output_mtok: 5

  - id: magistral-small
    name: Magistral Small
    match:
      starts_with: magistral-small-
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.5
      output_mtok: 1.5

  - id: ministral-3b
    name: Ministral 3B
    match:
      equals: ministral-3b
    prices:
      input_mtok: 0.04
      output_mtok: 0.04

  - id: ministral-8b
    name: Ministral 8B 24.10
    match:
      starts_with: ministral-8b
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.1
      output_mtok: 1

  - id: mistral-7b
    name: Mistral 7B
    match:
      or:
        - equals: mistral-7b
        - equals: open-mistral-7b
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.25
      output_mtok: 0.25

  - id: mistral-embed
    match:
      equals: mistral-embed
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: mistral-large
    name: Mistral Large
    match:
      or:
        - equals: mistral-large
        - equals: mistral-large-latest
        - equals: mistral-large-2407
        - equals: mistral-large-2411
    prices_checked: 2025-07-04
    prices:
      input_mtok: 2
      output_mtok: 6

  - id: mistral-medium-3
    name: Mistral Medium 3
    match:
      starts_with: mistral-medium
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.4
      output_mtok: 2

  - id: mistral-nemo
    name: Mistral NeMo
    match:
      or:
        - equals: mistral-nemo
        - equals: open-mistral-nemo
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.15
      output_mtok: 0.15

  - id: mistral-nemo:free
    free: true
    name: Mistral Nemo (free)
    match:
      equals: mistral-nemo:free
    prices: {}

  - id: mistral-saba
    name: Mistral Saba
    match:
      or:
        - equals: mistral-saba
        - equals: mistral-saba-latest
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.2
      output_mtok: 0.6

  - id: mistral-small-24b-instruct-2501
    name: Mistral Small 3
    match:
      equals: mistral-small-24b-instruct-2501
    prices_checked: 2025-07-05
    price_comments: Can't find pricing on this model, so just trusting open router
    prices:
      input_mtok: 0.05
      output_mtok: 0.08

  - id: mistral-small-24b-instruct-2501:free
    free: true
    name: Mistral Small 3 (free)
    match:
      equals: mistral-small-24b-instruct-2501:free
    prices: {}

  - id: mistral-small-latest
    name: Mistral Small 3.2
    match:
      equals: mistral-small-latest
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.1
      output_mtok: 0.3

  - id: mistral-tiny
    name: Mistral Tiny
    match:
      equals: mistral-tiny
    deprecated: true
    prices:
      input_mtok: 0.25
      output_mtok: 0.25

  - id: mixtral-8x22b-instruct
    name: Mixtral 8x22B Instruct
    match:
      equals: mixtral-8x22b-instruct
    prices:
      input_mtok: 0.9
      output_mtok: 0.9

  - id: mixtral-8x7b
    name: Mixtral 8x7B
    match:
      or:
        - starts_with: mixtral-8x7b
        - equals: open-mixtral-8x7b
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.7
      output_mtok: 0.7

  - id: pixtral-12b
    name: Pixtral 12B
    match:
      or:
        - equals: pixtral-12b
        - equals: pixtral-12b-latest
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.15
      output_mtok: 0.15

  - id: pixtral-large
    name: Pixtral Large 2411
    match:
      or:
        - equals: pixtral-large-latest
        - equals: pixtral-large-2411
    prices:
      input_mtok: 2
      output_mtok: 6
