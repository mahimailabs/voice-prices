# yaml-language-server: $schema=.schema.json
name: Twilio
id: twilio
pricing_urls:
  - https://www.twilio.com/en-us/voice/pricing/us

api_pattern: 'https://api\.twilio\.com'

provider_match:
  contains: twilio

# No model_match on purpose. These ids (`us-local-inbound`) are catalog constructions, not
# strings Twilio's API returns, so there is nothing for a bare model_ref to match against and a
# prefix like `us-` would claim far too much. Resolve with provider_id='twilio'.

price_comments: >-
  Carrier pricing for the call leg, which an agent on a phone number pays on top of speech and
  the model. United States only for now: Twilio prices per country and per destination, so
  every other country is added rows rather than a schema change.
  Not modelled here: the monthly phone number rental (from $1.15/month for a US local number),
  which is a recurring fee rather than a per-unit rate and has nowhere to live in a per-minute
  catalog. A cost estimate built from the rates below alone omits it.
  Also not modelled: $0.1000 per SIP refer, and the per-country surcharges on international
  destinations.

pricing_tier: Pay-as-you-go

models:
  - id: us-client-inbound
    name: US Browser/app (inbound)
    description: >-
      Calls received over Twilio's browser/app (WebRTC) client rather than the phone network.
      No carrier leg, which is why it costs a quarter of a local call.
    match:
      equals: us-client-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0040/minute, the "Browser/app" row, "To receive calls" column.
      Converted to $/k minutes: 0.0040 * 1000 = 4 exactly.
    prices:
      telephony_kminutes: 4

  - id: us-client-outbound
    name: US Browser/app (outbound)
    description: >-
      Calls placed over Twilio's browser/app (WebRTC) client. Same rate as inbound.
    match:
      equals: us-client-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0040/minute, the "Browser/app" row, "To make calls" column.
      Converted to $/k minutes: 0.0040 * 1000 = 4 exactly.
    prices:
      telephony_kminutes: 4

  - id: us-local-inbound
    name: US local (inbound)
    description: >-
      Calls received on a US local number. The common case for an inbound voice agent.
    match:
      equals: us-local-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0085/minute, the "Local calls" row, "To receive calls" column.
      Converted to $/k minutes: 0.0085 * 1000 = 8.5 exactly.
      Cheaper than placing the call, which is the opposite of toll-free. Direction is priced,
      not incidental.
    prices:
      telephony_kminutes: 8.5

  - id: us-local-outbound
    name: US local (outbound)
    description: >-
      Calls placed to a US local number. The common case for an outbound voice agent.
    match:
      equals: us-local-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0140/minute, the "Local calls" row, "To make calls" column.
      Converted to $/k minutes: 0.0140 * 1000 = 14 exactly.
    prices:
      telephony_kminutes: 14

  - id: us-sip-inbound
    name: US SIP interface (inbound)
    description: >-
      Calls received over a SIP trunk you bring yourself. No Twilio number involved, so you
      pay the interface rate rather than a carrier rate.
    match:
      equals: us-sip-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0040/minute, the "SIP interface" row, "To receive calls" column.
      Converted to $/k minutes: 0.0040 * 1000 = 4 exactly.
      Excludes the $0.1000 per refer charge Twilio lists in the same row, which is a
      per-event fee rather than a per-minute one.
    prices:
      telephony_kminutes: 4

  - id: us-sip-outbound
    name: US SIP interface (outbound)
    description: >-
      Calls placed over a SIP trunk you bring yourself. Same rate as inbound, and the
      cheapest way to carry an agent call on this provider.
    match:
      equals: us-sip-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0040/minute, the "SIP interface" row, "To make calls" column.
      Converted to $/k minutes: 0.0040 * 1000 = 4 exactly.
    prices:
      telephony_kminutes: 4

  - id: us-tollfree-inbound
    name: US toll-free (inbound)
    description: >-
      Calls received on a US toll-free number. The caller pays nothing, which is why this is
      the most expensive row here.
    match:
      equals: us-tollfree-inbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0220/minute, the "Toll-free calls" row, "To receive calls" column.
      Converted to $/k minutes: 0.0220 * 1000 = 22 exactly.
      Note the inversion against local: receiving toll-free costs 57% MORE than dialling out
      on it, while receiving local costs 39% less than dialling out. Assuming inbound is
      always the cheaper direction gets this row wrong by 2.6x.
    prices:
      telephony_kminutes: 22

  - id: us-tollfree-outbound
    name: US toll-free (outbound)
    description: >-
      Calls placed to a US toll-free number. Same rate as an outbound local call.
    match:
      equals: us-tollfree-outbound
    prices_checked: 2026-08-20
    pricing_source_url: https://www.twilio.com/en-us/voice/pricing/us
    price_comments: >-
      Source rate $0.0140/minute, the "Toll-free calls" row, "To make calls" column.
      Converted to $/k minutes: 0.0140 * 1000 = 14 exactly.
    prices:
      telephony_kminutes: 14
