# yaml-language-server: $schema=.schema.json
name: Deepgram
id: deepgram
pricing_urls:
  - https://deepgram.com/pricing

api_pattern: 'https://api\.deepgram\.com'

model_match:
  or:
    - starts_with: aura-
    - starts_with: nova-
    - starts_with: flux-

provider_match:
  contains: deepgram

pricing_tier: Pay As You Go

models:
  - id: aura-1
    name: Aura
    description: >-
      Deepgram's original Aura TTS family. Per-character pricing is uniform across
      all voices in the family. Voice IDs are formatted aura-<voice>-<lang> (no
      version number in the slug), e.g. aura-asteria-en, aura-luna-en.
    # Match aura-* but NOT aura-2-*: the Aura-1 family voice IDs don't carry a
    # version number, while Aura-2 does.
    match:
      regex: '^aura-(?!2)'
    prices_checked: 2026-05-27
    pricing_source_url: https://deepgram.com/pricing
    prices:
      input_kchars: 0.015

  - id: aura-2
    name: Aura-2
    description: >-
      Deepgram's second-generation Aura TTS family. Per-character pricing is uniform
      across all voices in the family. Voice IDs include the version, e.g.
      aura-2-helios-en, aura-2-thalia-en.
    match:
      starts_with: aura-2
    prices_checked: 2026-05-27
    pricing_source_url: https://deepgram.com/pricing
    prices:
      input_kchars: 0.030

  - id: base
    name: Base (legacy)
    description: >-
      Deepgram's first-generation STT tier, still available for existing deployments.
      Documented as `base or base-general` plus a set of domain variants, all at one
      tier rate. Superseded by Nova-3; priced here so historical usage can be costed.
    match:
      # Deepgram's model listing gives both the bare domain name (`phonecall`) and the
      # prefixed form (`base-phonecall`) for this tier, so both are listed. Explicit
      # `equals` rather than a prefix, for the reasons on the nova-2 entry.
      or:
        - equals: base
        - equals: base-general
        - equals: base-conversationalai
        - equals: base-finance
        - equals: base-meeting
        - equals: base-phonecall
        - equals: base-video
        - equals: base-voicemail
        - equals: conversationalai
        - equals: finance
        - equals: meeting
        - equals: phonecall
        - equals: video
        - equals: voicemail
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.87/hour, published by Deepgram in the pricing-page FAQ: "These remain
      available at unchanged rates for existing deployments: Nova-2 streaming at $0.35/hour,
      Enhanced at $0.99/hour, and Base at $0.87/hour."
      Converted to $/k seconds: 0.87 / 3600 * 1000 = 0.2416666 recurring, stored as 0.241667.
      One tier rate covers every domain variant; the FAQ prices the tier and the main rate
      tables do not list Base at all. No streaming/prerecorded split is published for this
      tier, so unlike nova-3 there is no `-batch` row.
      The bare domain ids (`phonecall`, `meeting`) are deliberately NOT added to the
      provider-level `model_match`: they are too generic to claim for Deepgram from a bare
      model_ref. They resolve when `provider_id='deepgram'` is supplied, which is how a
      voice runtime names them.
    prices:
      input_audio_kseconds: 0.241667

  - id: enhanced
    name: Enhanced (legacy)
    description: >-
      Deepgram's second-generation STT tier, between Base and Nova. Documented as
      `enhanced or enhanced-general` plus domain variants, all at one tier rate.
      Still available for existing deployments; superseded by Nova-3.
    match:
      or:
        - equals: enhanced
        - equals: enhanced-general
        - equals: enhanced-finance
        - equals: enhanced-meeting
        - equals: enhanced-phonecall
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.99/hour, from the same pricing-page FAQ answer that publishes the Base
      and Nova-2 legacy rates. Converted to $/k seconds: 0.99 / 3600 * 1000 = 0.275 exactly.
      Worth noting this legacy tier costs more than every current model: Nova-3 monolingual
      streaming is $0.29/hour and prerecorded $0.26/hour. Enhanced is priced where it was
      when it was current, which is why Deepgram recommends new projects start on Nova-3.
    prices:
      input_audio_kseconds: 0.275

  - id: flux-general
    name: Flux (streaming)
    description: >-
      Deepgram Flux conversational speech recognition for real-time voice agents,
      with built-in turn detection and interruption handling. English.
      Streaming only: Flux runs on `wss://api.deepgram.com/v2/listen` and has no
      prerecorded endpoint, so there is no batch rate for it.
      `flux-general-en` is the id Deepgram's own docs give for English Flux, so a caller
      passing what the API accepts resolves here.
    match:
      # Deepgram's model listing names English Flux `flux-general-en`; the bare
      # `flux-general` is kept because the catalog has published it since 2026-05.
      # `flux-general-multi` is a different rate ($0.0078/min) and is not priced yet.
      or:
        - equals: flux-general
        - equals: flux-general-en
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0065/minute, the "Current price" for Flux English under Streaming,
      Pay As You Go. Converted to $/k seconds: 0.0065 * 1000 / 60 ~= 0.108333.
      Read the CURRENT price, not the "Regular price" $0.0077/minute printed beside it.
      Deepgram is running a limited-time streaming promotion and each streaming cell shows
      both numbers; $0.0065 is what is charged today. The FAQ agrees: "Flux ... runs
      $0.39/hour monolingual", which is $0.0065/minute.
      There is deliberately no `flux-general-batch`. One existed until 2026-08-20 holding
      $0.0077/minute, which was the regular streaming price misread as a prerecorded rate.
      Deepgram's Pre-Recorded table lists only Nova-3 Monolingual, Nova-3 Multilingual,
      Whisper Large and Custom; Flux has never been on it.
    prices:
      input_audio_kseconds: 0.108333

  - id: nova
    name: Nova-1 (legacy, unpriced)
    description: >-
      Deepgram's first Nova generation, listed under "Legacy Models" in their model docs and
      still callable. Resolves so a caller learns the model exists; carries no rate because
      Deepgram publishes none.
    match:
      or:
        - equals: nova
        - equals: nova-general
        - equals: nova-medical
        - equals: nova-meeting
        - equals: nova-phonecall
    price_comments: >-
      Deliberately unpriced. Deepgram's pricing FAQ names the legacy rates it still honours,
      "Nova-2 streaming at $0.35/hour, Enhanced at $0.99/hour, and Base at $0.87/hour", and
      Nova-1 is absent from that list and from every rate table. The PriceToken registry does
      not carry it either.
      Resolving-but-unpriced is deliberate: a LookupError says "this model does not exist",
      which is false, while a guessed rate would be worse. Empty prices say what is true,
      that the model is real and its rate is not published. Add a rate only from a Deepgram
      page or invoice that states one.
    provenance:
      source: seed
    prices: {}

  - id: nova-2
    name: Nova-2 (streaming)
    description: >-
      Deepgram Nova-2 streaming STT, English / monolingual. Previous-generation
      model. Use `nova-2` for streaming, `nova-2-batch` for prerecorded.
      The domain variants (`nova-2-phonecall`, `nova-2-medical` and the rest) are the
      same tier at the same rate, so they all resolve here.
    match:
      # Deepgram documents `nova-2 or nova-2-general` as one model option, and lists the
      # domain variants underneath the same Nova-2 tier. The pricing page prices the tier,
      # never the variant, so every id below bills identically.
      #
      # These are `equals` clauses rather than `starts_with: nova-2` on purpose. A prefix
      # match would swallow `nova-2-batch`, which the build refuses outright (a model's
      # matcher may not match another model's id), and the models-sorted-by-id invariant
      # makes it impossible to order the specific entry ahead of the general one anyway.
      # Listing ids also fails loudly on a variant Deepgram adds later, instead of quietly
      # pricing an unknown model at a guessed rate.
      or:
        - equals: nova-2
        - equals: nova-2-general
        - equals: nova-2-atc
        - equals: nova-2-automotive
        - equals: nova-2-conversationalai
        - equals: nova-2-drivethru
        - equals: nova-2-finance
        - equals: nova-2-medical
        - equals: nova-2-meeting
        - equals: nova-2-phonecall
        - equals: nova-2-video
        - equals: nova-2-voicemail
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.35/hour, published by Deepgram in the pricing-page FAQ: "These remain
      available at unchanged rates for existing deployments: Nova-2 streaming at $0.35/hour,
      Enhanced at $0.99/hour, and Base at $0.87/hour."
      Converted to $/k seconds: 0.35 / 3600 * 1000 = 0.0972222 recurring, stored as 0.097222.
      This replaces 0.098333, which came from third-party trackers quoting $0.0059/minute
      while this row carried a "verify before relying on it" note. Deepgram's own figure
      works out to $0.0058333/minute, so the old rate was about 1.1% high. Nova-2 is still
      absent from the main rate tables; the FAQ is now the vendor's published source for it.
    prices:
      input_audio_kseconds: 0.097222

  - id: nova-2-batch
    name: Nova-2 (batch)
    description: >-
      Deepgram Nova-2 prerecorded / batch STT, English / monolingual. Legacy model.
    match:
      equals: nova-2-batch
    prices_checked: 2026-05-29
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0043/minute (prerecorded). Converted to $/k seconds:
      0.0043 * 1000 / 60 ~= 0.071667. Nova-2 is a legacy model no longer listed in
      Deepgram's public pricing table; rate from independent sources. Verify before
      relying on it.
      Unresolved as of 2026-08-20: this is the only Deepgram row still with no vendor
      source. The pricing FAQ publishes Nova-2 STREAMING ($0.35/hour) but says nothing
      about prerecorded. Note that $0.0043/minute is also exactly Nova-3 Monolingual's
      prerecorded rate, so this figure may have been taken from the Nova-3 row rather than
      a Nova-2 one, the same way the nova-3-batch and flux-general-batch rates were taken
      from the wrong column. It is left unchanged because there is no evidence either way,
      and replacing one unsourced number with another would not be an improvement.
    prices:
      input_audio_kseconds: 0.071667

  - id: nova-3
    name: Nova-3 (monolingual streaming)
    description: >-
      Deepgram Nova-3 streaming STT, English / monolingual rate. Real-time
      transcription model. Use `nova-3` for streaming, `nova-3-batch` for
      prerecorded. Use `nova-3-multilingual` (or `-batch` variant) for non-English
      or mixed-language workloads at Deepgram's higher multilingual rate.
      `nova-3-general` is Deepgram's own alias for `nova-3`; `nova-3-medical` is the
      English-only medical variant of the same tier, so both resolve here.
    match:
      # Deepgram documents the option as "nova-3 or nova-3-general", and lists
      # nova-3-medical (English only, so monolingual) under the same tier. Explicit
      # `equals` clauses rather than `starts_with: nova-3`, which would swallow
      # nova-3-batch and nova-3-multilingual and fail the build.
      or:
        - equals: nova-3
        - equals: nova-3-general
        - equals: nova-3-medical
    prices_checked: 2026-05-28
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0048/minute. Converted to $/k seconds:
      0.0048 * 1000 / 60 = 0.08 exactly.
    prices:
      input_audio_kseconds: 0.08

  - id: nova-3-batch
    name: Nova-3 (monolingual batch)
    description: >-
      Deepgram Nova-3 prerecorded / batch STT, English / monolingual rate.
      Cheaper per-minute than streaming, as prerecorded is throughout Deepgram's catalog.
    match:
      equals: nova-3-batch
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0043/minute, Nova-3 Monolingual under the Pre-Recorded tab,
      Pay As You Go. Converted to $/k seconds: 0.0043 * 1000 / 60 = 0.0716666 recurring,
      stored as 0.071667.
      Corrected on 2026-08-20 from 0.12833. That value was $0.0077/minute, which is the
      "Regular price" shown beside the discounted "Current price" in the STREAMING table,
      not a prerecorded rate at all. Deepgram runs a limited-time streaming promotion and
      renders both numbers in one cell, next to a separate Streaming / Pre-Recorded toggle;
      the second number was read as the prerecorded price. The archived pricing page from
      2026-05-31, the day this row was written, already showed $0.0043 under Pre-Recorded,
      so the rate was wrong when recorded rather than having drifted since.
      The tell was that batch cost 60% more than streaming ($0.0077 against $0.0048), which
      is backwards; `test_batch_rates` now asserts the ordering.
    prices:
      input_audio_kseconds: 0.071667

  - id: nova-3-multilingual
    name: Nova-3 (multilingual streaming)
    description: >-
      Deepgram Nova-3 streaming STT, multilingual rate. Use for non-English or
      mixed-language workloads. Higher per-minute than the monolingual rate.
    match:
      equals: nova-3-multilingual
    prices_checked: 2026-05-28
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0058/minute. Converted to $/k seconds:
      0.0058 * 1000 / 60 ~= 0.09667.
    prices:
      input_audio_kseconds: 0.09667

  - id: nova-3-multilingual-batch
    name: Nova-3 (multilingual batch)
    description: >-
      Deepgram Nova-3 prerecorded / batch STT, multilingual rate.
    match:
      equals: nova-3-multilingual-batch
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0052/minute, Nova-3 Multilingual under the Pre-Recorded tab,
      Pay As You Go. Converted to $/k seconds: 0.0052 * 1000 / 60 = 0.0866666 recurring,
      stored as 0.086667.
      Corrected on 2026-08-20 from 0.15333, which was $0.0092/minute: the "Regular price"
      of the STREAMING row, not a prerecorded rate. Same misreading as `nova-3-batch`, and
      the same evidence against it, the archived page from 2026-05-31 already showing
      $0.0052 under Pre-Recorded.
    prices:
      input_audio_kseconds: 0.086667

  - id: whisper
    name: Whisper tiny/base/small/medium (Deepgram-hosted, unpriced)
    description: >-
      The smaller Deepgram-hosted Whisper sizes. Callable as `?model=whisper-SIZE`, with
      bare `whisper` aliasing whisper-medium. Resolve here unpriced; only Whisper Large has
      a published rate, and it is a separate row.
    match:
      or:
        - equals: whisper
        - equals: whisper-tiny
        - equals: whisper-base
        - equals: whisper-small
        - equals: whisper-medium
    price_comments: >-
      Deliberately unpriced. Deepgram's Pre-Recorded table carries one Whisper row, "Whisper
      Large" at $0.0048/minute, while their model docs document five sizes. Nothing states
      that the smaller sizes bill at the Large rate, and hosted-model pricing usually tracks
      model size, so inheriting it would be a guess in the expensive direction.
      See `whisper-large` for the one size Deepgram does price.
    provenance:
      source: seed
    prices: {}

  - id: whisper-large
    name: Whisper Large (Deepgram-hosted)
    description: >-
      OpenAI Whisper Large hosted by Deepgram, prerecorded only. Called as
      `?model=whisper-large` on the Deepgram API, so it is a Deepgram-billed model rather
      than an OpenAI one. Concurrency is capped separately (5 streams on Pay As You Go).
    match:
      equals: whisper-large
    prices_checked: 2026-08-20
    pricing_source_url: https://deepgram.com/pricing
    price_comments: >-
      Source rate $0.0048/minute, the "Whisper Large" row of the Pre-Recorded table,
      Pay As You Go. Converted to $/k seconds: 0.0048 * 1000 / 60 = 0.08 exactly.
      Unusually, the Growth plan rate is also $0.0048: Deepgram discounts its own models on
      Growth but not this one.
      Only Whisper Large is priced. Deepgram's model listing also documents whisper-tiny,
      whisper-base, whisper-small and whisper-medium (and `whisper` as an alias for
      whisper-medium), but the pricing page carries a rate for Large alone. Those four are
      deliberately absent rather than aliased to this rate, which would publish a number
      Deepgram has not put against them.
      Not added to the provider `model_match`: `whisper-` is already claimed there by
      OpenAI, so a bare `whisper-large` would be ambiguous between two vendors who both
      host it. Resolve it with `provider_id='deepgram'`.
    prices:
      input_audio_kseconds: 0.08
