# yaml-language-server: $schema=.schema.json
name: ElevenLabs
id: elevenlabs
pricing_urls:
  - https://elevenlabs.io/pricing/api

api_pattern: 'https://api\.elevenlabs\.io'

model_match:
  or:
    - starts_with: eleven_
    - starts_with: scribe_

provider_match:
  contains: elevenlabs

price_comments: >-
  ElevenLabs publishes a per-character API rate that is consistent across paid
  subscription tiers (higher tiers include a larger character allowance, not a
  lower per-character rate). This catalog uses that published API rate: Flash and
  Turbo models are $0.05/kchar (0.5 credits/character) and Multilingual v2 is
  $0.10/kchar (1 credit/character). See https://elevenlabs.io/pricing/api.

pricing_tier: Single published rate

models:
  - id: eleven_flash_v2
    name: Eleven Flash v2
    description: >-
      Low-latency English TTS model (the v2 predecessor of Flash v2.5). Same
      per-character API rate as Flash v2.5.
    match:
      equals: eleven_flash_v2
    prices_checked: 2026-06-06
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.05/kchar via the ElevenLabs API (Flash/Turbo, 0.5 credits/character).
    prices:
      input_kchars: 0.05

  - id: eleven_flash_v2_5
    name: Eleven Flash v2.5
    description: >-
      Low-latency multilingual TTS model. Optimized for real-time / streaming
      use cases. Same per-character API rate as Turbo v2.5.
    match:
      starts_with: eleven_flash_v2_5
    # collapse: false because this id starts with eleven_flash_v2 and shares its price; without the pin
    # the collapse hook would merge this row into eleven_flash_v2 and drop the v2.5 comparison.
    collapse: false
    prices_checked: 2026-06-06
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.05/kchar via the ElevenLabs API (Flash/Turbo, 0.5 credits/character).
    prices:
      input_kchars: 0.05

  - id: eleven_multilingual_v1
    name: Eleven Multilingual v1 (legacy, unpriced)
    description: >-
      First-generation multilingual text-to-speech. Still listed in ElevenLabs' model docs and
      still callable; resolves so a caller learns it exists, but carries no rate because the
      pricing page no longer lists it.
    match:
      equals: eleven_multilingual_v1
    price_comments: >-
      Deliberately unpriced. The Model pricing table lists v3, v3 Conversational, v2
      Multilingual, Scribe v2 and Scribe v2 Realtime, and no v1 row. ElevenLabs bills TTS per
      character at a per-model rate, so inheriting v2's $0.10/1k would be a guess about a model
      they chose to stop pricing publicly.
      `eleven_monolingual_v1` is deliberately absent entirely rather than added alongside this:
      it does not appear in ElevenLabs' current model list at all, so a row for it would assert
      a model that may no longer exist.
    provenance:
      source: seed
    prices: {}

  - id: eleven_multilingual_v2
    name: Eleven Multilingual v2
    description: >-
      Full-fidelity multilingual TTS model. Higher per-character cost than
      Turbo/Flash; used when output quality matters more than latency.
    match:
      starts_with: eleven_multilingual_v2
    prices_checked: 2026-06-06
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.10/kchar via the ElevenLabs API (Multilingual v2, 1 credit/character).
    prices:
      input_kchars: 0.1

  - id: eleven_turbo_v2
    name: Eleven Turbo v2
    description: >-
      Low-latency TTS model (the v2 predecessor of Turbo v2.5). Same
      per-character API rate as Turbo v2.5.
    match:
      equals: eleven_turbo_v2
    prices_checked: 2026-06-06
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.05/kchar via the ElevenLabs API (Flash/Turbo, 0.5 credits/character).
    prices:
      input_kchars: 0.05

  - id: eleven_turbo_v2_5
    name: Eleven Turbo v2.5
    description: >-
      ElevenLabs' fastest multilingual TTS model. Designed for real-time use
      cases where latency matters more than absolute audio fidelity.
    match:
      starts_with: eleven_turbo_v2_5
    # collapse: false for the same reason as eleven_flash_v2_5 above (shares price + id prefix with
    # eleven_turbo_v2, which would otherwise merge this row away).
    collapse: false
    prices_checked: 2026-06-06
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.05/kchar via the ElevenLabs API (Flash/Turbo, 0.5 credits/character).
    prices:
      input_kchars: 0.05

  - id: eleven_v3
    name: Eleven v3
    description: >-
      ElevenLabs' current flagship, human-like and expressive speech across 70+ languages.
      Priced with Multilingual v2 rather than the cheaper Flash/Turbo tiers.
    match:
      # `equals`, not `starts_with: eleven_v3`. The pricing page carries a separate
      # "v3 Conversational" row at HALF this rate ($0.05/1k), so a prefix match would hand
      # any future `eleven_v3_*` id the more expensive number.
      equals: eleven_v3
    prices_checked: 2026-08-20
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      $0.10 per 1,000 characters via the ElevenLabs API, the "v3" row of the Text to Speech
      API table (1 credit/character, as for Multilingual v2). Stored directly: input_kchars
      is already per 1,000 characters, so no conversion. The rate is identical across every
      plan column from Free through Business, so there is no tier to choose.
      Same rate as eleven_multilingual_v2 and double the Flash/Turbo tiers at $0.05.
      Not priced here: the "v3 Conversational" row at $0.05/1k characters. It is half the
      cost and appears to be a distinct product rather than a plan discount, but the models
      docs list no separate model id for it, so there is nothing to key a row on yet.
      The page also quotes "~$0.10/minute" beside the rate; that is an approximation from an
      assumed speaking rate, not a second meter, and is not recorded.
    prices:
      input_kchars: 0.1

  - id: scribe_v1
    name: Scribe v1 (legacy, unpriced)
    description: >-
      First-generation ElevenLabs speech-to-text. Accepted by the LiveKit plugin, which types
      model_id as Literal["scribe_v1", "scribe_v2", "scribe_v2_realtime"], but no longer priced
      on the pricing page.
    match:
      equals: scribe_v1
    price_comments: >-
      Deliberately unpriced. The pricing page carries Scribe v2 and Scribe v2 Realtime only.
      Callable, so it resolves rather than raising, but no rate is published for it.
    provenance:
      source: seed
    prices: {}

  - id: scribe_v2
    name: Scribe v2
    description: >-
      ElevenLabs speech-to-text for pre-recorded audio. 90+ languages, keyterm prompting,
      word-level timestamps. Passed as `model_id: "scribe_v2"`.
    match:
      equals: scribe_v2
    prices_checked: 2026-08-21
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      Source rate $0.22 per hour, the Scribe v2 card in the Model pricing section, labelled
      "Price per hour". Converted to $/k seconds: 0.22 / 3600 * 1000 = 0.0611111 recurring,
      stored as 0.061111.
      Excludes the surcharges ElevenLabs documents on the transcription API: entity detection
      or redaction adds 30%, speaker-role detection adds 10%. Those are per-request options
      rather than a rate, so the number here is the base transcription cost.
    prices:
      input_audio_kseconds: 0.061111

  - id: scribe_v2_realtime
    name: Scribe v2 Realtime
    description: >-
      ElevenLabs streaming speech-to-text, roughly 150ms latency. The variant a realtime voice
      agent runs. Passed as `model_id: "scribe_v2_realtime"`.
    match:
      equals: scribe_v2_realtime
    prices_checked: 2026-08-21
    pricing_source_url: https://elevenlabs.io/pricing/api
    price_comments: >-
      Source rate $0.39 per hour, the Scribe v2 Realtime card, labelled "Price per hour".
      Converted to $/k seconds: 0.39 / 3600 * 1000 = 0.1083333 recurring, stored as 0.108333.
      77% above the pre-recorded Scribe v2, which is a steeper realtime premium than most of
      this catalog: Deepgram charges about 12% more for streaming Nova-3 than prerecorded.
      Same surcharge exclusions as scribe_v2.
    prices:
      input_audio_kseconds: 0.108333
