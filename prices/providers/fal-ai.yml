  - id: fal-ai/elevenlabs/tts/turbo-v2.5
    name: ElevenLabs TTS Turbo v2.5 (via fal)
    description: >-
      ElevenLabs' Turbo v2.5 model served through the fal Model API. Low-latency
      multilingual text-to-speech for real-time use. Billed per 1,000 characters by fal.
    match:
      equals: fal-ai/elevenlabs/tts/turbo-v2.5
    prices_checked: 2026-08-16
    pricing_source_url: https://fal.ai/models/fal-ai/elevenlabs/tts/turbo-v2.5
    price_comments: >-
      fal publishes $0.05 per 1000 characters for this endpoint; input_kchars = 0.05.
    prices:
      input_kchars: 0.05

  - id: fal-ai/f5-tts
    name: F5 TTS (via fal)
    description: >-
      F5-TTS diffusion model served through the fal Model API. Zero-shot voice cloning from
      a single reference audio sample. Billed per 1,000 characters by fal.
    match:
      equals: fal-ai/f5-tts
    prices_checked: 2026-08-16
