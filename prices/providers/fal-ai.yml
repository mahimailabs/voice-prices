# yaml-language-server: $schema=../../prices/providers/.schema.json
name: fal.ai
id: fal
pricing_urls:
  - https://fal.ai/pricing

api_pattern: 'https://(queue\.)?fal\.run'

model_match:
  starts_with: fal-ai/

provider_match:
  contains: fal

price_comments: >-
  fal.ai is a model-hosting marketplace; it resells many third-party TTS models (ElevenLabs,
  MiniMax, F5-TTS, Chatterbox, etc.) through the fal Model API. Every model below bills per
  1,000 input characters, and fal publishes that unit price directly on each model's page
  (see the per-model pricing_source_url). input_kchars is therefore the published dollar rate
  per 1,000 characters with no conversion needed. Rates verified 2026-08-16 from fal's
  official model pages (fal.ai/models/<endpoint-id>).

models:
  - id: fal-ai/elevenlabs/tts/eleven-v3
    name: ElevenLabs TTS Eleven v3 (via fal)
    description: >-
      ElevenLabs' Eleven v3 model served through the fal Model API. High-quality
      multilingual text-to-speech with voice control. Billed per 1,000 characters by fal.
    match:
      equals: fal-ai/elevenlabs/tts/eleven-v3
    prices_checked: 2026-08-16
    pricing_source_url: https://fal.ai/models/fal-ai/elevenlabs/tts/eleven-v3
    price_comments: >-
      fal publishes $0.1 per 1000 characters for this endpoint; input_kchars = 0.1.
    prices:
      input_kchars: 0.1

  - id: fal-ai/elevenlabs/tts/multilingual-v2
    name: ElevenLabs TTS Multilingual v2 (via fal)
    description: >-
      ElevenLabs' Multilingual v2 model served through the fal Model API. Full-fidelity
      multilingual text-to-speech. Billed per 1,000 characters by fal.
    match:
      equals: fal-ai/elevenlabs/tts/multilingual-v2
    prices_checked: 2026-08-16
    pricing_source_url: https://fal.ai/models/fal-ai/elevenlabs/tts/multilingual-v2
    price_comments: >-
      fal publishes $0.1 per 1000 characters for this endpoint; input_kchars = 0.1.
    prices:
