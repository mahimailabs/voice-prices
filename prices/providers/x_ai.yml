# yaml-language-server: $schema=.schema.json
name: X AI
id: x-ai
pricing_urls:
  - https://docs.x.ai/docs/models
  - https://docs.x.ai/docs/pricing

# xAI publishes one rate per model with no plans to choose between.
pricing_tier: Single published rate
api_pattern: 'https://api\.x\.ai'
model_match:
  contains: grok
provider_match:
  equals: xai
extractors:
  # xAI native SDK format (xai-sdk) — protobuf SamplingUsage fields
  # https://github.com/xai-org/xai-sdk-python/blob/main/src/xai_sdk/proto/v6/usage_pb2.pyi
  - api_flavor: default
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: cached_prompt_text_tokens
        dest: cache_read_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # OpenAI-compatible chat completions format
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: grok-2-1212
    name: Grok 2 1212
    description: >-
      (deprecated) Grok 2 1212 introduces significant enhancements to accuracy, instruction adherence, and multilingual support, making
      it a powerful and flexible choice for developers seeking a highly steerable, intelligent model.
    match:
      or:
        - equals: grok-2-1212
        - equals: grok-2
        - equals: grok-2-latest
    context_window: 32768
    deprecated: true
    prices_checked: 2025-07-12
    prices:
      input_mtok: 2
      output_mtok: 10

  - id: grok-2-vision-1212
    name: Grok 2 Vision 1212
