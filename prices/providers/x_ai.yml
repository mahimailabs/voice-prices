  - id: grok-stt
    name: Grok Speech to Text (streaming)
    description: >-
      Realtime transcription over the streaming endpoint, which is what the LiveKit xAI plugin
      uses. Use `grok-stt-batch` for the REST endpoint.
    match:
      equals: grok-stt
    prices_checked: 2026-08-21
    pricing_source_url: https://docs.x.ai/docs/pricing
    price_comments: >-
      Source rate $0.20 per hour, the Streaming half of the "Speech to Text" row of the Voice
      API table. Converted to $/k seconds: 0.20 / 3600 * 1000 = 0.0555555 recurring, stored as
      0.055556.
      `grok-stt` is a catalog id: xAI documents Speech to Text as a mode of the Voice API, not
      as a named model, so there is no value to mirror. Resolve with provider_id='x-ai'.
    prices:
      input_audio_kseconds: 0.055556

  - id: grok-stt-batch
    name: Grok Speech to Text (REST)
    description: >-
      Pre-recorded transcription over the REST endpoint, at half the streaming rate.
    match:
      equals: grok-stt-batch
    prices_checked: 2026-08-21
    pricing_source_url: https://docs.x.ai/docs/pricing
    price_comments: >-
      Source rate $0.10 per hour, the REST half of the same "Speech to Text" row. Converted to
      $/k seconds: 0.10 / 3600 * 1000 = 0.0277777 recurring, stored as 0.027778.
    prices:
      input_audio_kseconds: 0.027778

  - id: grok-tts
    name: Grok Text to Speech
    description: >-
      xAI's speech synthesis, billed per character with one published rate.
    match:
      equals: grok-tts
    prices_checked: 2026-08-21
    pricing_source_url: https://docs.x.ai/docs/pricing
    price_comments: >-
      Source rate $15.00 per 1M characters, the "Text to Speech" row of the Voice API table.
      Converted: 15 / 1000 = 0.015 per 1k characters. A catalog id, for the same reason as
      `grok-stt`.
    prices:
      input_kchars: 0.015

  - id: grok-voice-think-fast-2.0
    name: Grok Voice Think Fast 2.0
    description: >-
      Realtime speech-to-speech, billed per minute of audio rather than per token, so it
      carries `agent_kminutes` the way Ultravox does.
    match:
      equals: grok-voice-think-fast-2.0
    prices_checked: 2026-08-21
    pricing_source_url: https://docs.x.ai/docs/pricing
    price_comments: >-
      Source rate $0.08 per minute of audio ($4.80/hour). Converted to $/k minutes:
      0.08 * 1000 = 80 exactly.
      The models page shows this as "Agent, Starting at $0.05 / min". That $0.05 is not a floor
      on this model: it is grok-voice-think-fast-1.0, which the pricing page marks Deprecated.
      Reading only the "starting at" line would underprice the current model by 38%.
      Not modelled: the "$0.004 / text input" line carried alongside both speech-to-speech
      rates, whose unit the page does not state, and the deprecated 1.0 model.
    prices:
      agent_kminutes: 80
